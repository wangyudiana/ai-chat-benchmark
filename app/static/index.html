<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竞品采集台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<style>
/* 设计：暖白底、单一靛蓝强调色、细线 + 柔和阴影、充足留白。深浅色自动跟随系统 */
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --sunken:#F1F1EE; --ink:#18181B; --ink-2:#52525B; --ink-3:#6E6E78;
  --rule:#E6E5E0; --rule-2:#D9D8D2; --accent:#4F46E5; --accent-2:#4338CA; --accent-soft:#EEF0FF; --accent-ink:#FFFFFF;
  --mark:#FFE16A; --mark-ink:#2B2300; --bad:#C2312A; --bad-soft:#FDEDEB; --warn:#A15C07; --warn-soft:#FDF3E1;
  --good:#167A4A; --good-soft:#E6F4EC; --nav:#FBFBF9; --nav-ink:#3F3F46;
  --shadow:0 1px 2px rgba(24,24,27,.04),0 1px 1px rgba(24,24,27,.02); --shadow-2:0 8px 28px rgba(24,24,27,.10),0 2px 6px rgba(24,24,27,.05);
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E0E11; --surface:#17171B; --sunken:#1F1F24; --ink:#F4F4F5; --ink-2:#B4B4BC; --ink-3:#8E8E98;
    --rule:#29292F; --rule-2:#34343B; --accent:#8B93FF; --accent-2:#A3A9FF; --accent-soft:#1F1E3D; --accent-ink:#0B0B1A;
    --mark:#E9C93C; --mark-ink:#231C00; --bad:#FF8A80; --bad-soft:#3A1F1E; --warn:#F0A766; --warn-soft:#3A2B18;
    --good:#6FD3A0; --good-soft:#173226; --nav:#121215; --nav-ink:#C9C9D1;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;display:grid;grid-template-columns:224px minmax(0,1fr);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:2px}
[hidden]{display:none!important}
::selection{background:var(--accent-soft)}

/* nav */
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:20px 14px 14px;gap:2px;height:100vh;position:sticky;top:0;border-right:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;color:var(--ink)}
.brand svg{flex:none}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:.01em;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.nav a{display:flex;align-items:center;gap:10px;color:var(--nav-ink);text-decoration:none;padding:8px 10px;border-radius:9px;transition:background .12s,color .12s}
.nav a svg{width:17px;height:17px;flex:none;color:var(--ink-3);transition:color .12s}
.nav a:hover{background:var(--sunken)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:var(--shadow),0 0 0 1px var(--rule)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 7px;font-weight:650;line-height:18px}
.nav .grow{flex:1}
.engine{font-size:12px;line-height:1.55;padding:11px 12px;border:1px solid var(--rule);border-radius:11px;color:var(--ink-3);background:var(--surface)}
.engine b{color:var(--ink);font-weight:550}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 3px var(--good-soft)}
.pulse.idle{background:var(--ink-3);box-shadow:none;opacity:.6}

/* page */
.main{min-width:0;padding:32px 40px 72px;overflow-x:hidden;max-width:1480px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:24px;margin:0;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.ph p{margin:6px 0 0;color:var(--ink-3);max-width:62em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;height:34px;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  color:var(--ink);text-decoration:none;font-weight:500;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(79,70,229,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.big{height:44px;font-size:15px;width:100%;border-radius:11px}
.btn.small,.btn.ghost.small{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .caret{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px;opacity:.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.err{color:var(--bad)}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;width:100%;
  transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--ink-3);opacity:.8}
textarea{resize:vertical;line-height:1.65}
input[type=number]{width:72px;padding:5px 8px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--ink-2);transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:0 1px 2px rgba(24,24,27,.08),0 0 0 1px var(--rule)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:1px 9px 1px 8px;background:var(--sunken);color:var(--ink-2);white-space:nowrap;font-weight:500;line-height:20px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.badge.run{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c,var(--ink-3))}
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar i.f{background:var(--bad)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.steps{display:grid;gap:8px;max-width:460px;margin:16px auto 0;text-align:left}
.steps a{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--rule);border-radius:12px;color:var(--ink);text-decoration:none;transition:border-color .12s,background .12s}
.steps a:hover{border-color:var(--accent);background:var(--accent-soft)}
.steps b{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12.5px;flex:none}
.offline{position:fixed;top:0;left:0;right:0;z-index:98;background:var(--bad);color:#fff;padding:10px 16px;text-align:center;font-size:14px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:11px;z-index:99;opacity:0;
  transition:opacity .18s,transform .18s;pointer-events:none;max-width:80vw;box-shadow:var(--shadow-2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 下拉菜单 */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow-2);padding:6px;min-width:220px;display:grid;gap:1px}
.pop button,.pop a{display:grid;grid-template-columns:1fr;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--ink);text-decoration:none}
.pop button:hover,.pop a:hover{background:var(--sunken)}
.pop small{color:var(--ink-3);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}

/* new job */
.newgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.form{display:grid;gap:16px}
.field{padding:20px 22px}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fhead h2{font-size:15px;margin:0;font-weight:650}
.anaed{display:grid;gap:8px}
.optrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.optrow:first-child{border-top:0}
.optcs{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.optc{display:inline-flex;align-items:center;gap:6px}
.optc input{width:150px;padding:4px 8px}
.optc .seg button{padding:3px 10px}
.anaed label{color:var(--ink-2)}
.anagoal{padding:14px 16px}
.oblocks{display:grid;gap:10px}
.oblock{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:7px}
.oblock textarea{font-size:13px}
.tagx.link{border:0;cursor:pointer;color:var(--accent);background:var(--accent-soft)}
.tagx.link:hover{text-decoration:underline}
.linkbtn{display:block;border:0;background:none;padding:2px 0 0;color:var(--accent);font-size:12px;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.report.md{white-space:normal}
.report.md h4{margin:14px 0 4px;font-size:14.5px}
.report.md p{margin:4px 0}
.report.md ul,.report.md ol{margin:4px 0;padding-left:22px}
#qText{min-height:230px;font-size:14px}
.drop{border:2px dashed var(--rule);border-radius:9px;padding:26px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.libpick{display:grid;gap:6px}
.libpick button{display:flex;justify-content:space-between;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 12px}
.libpick button:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);background:var(--surface);border-radius:11px;padding:8px 13px;text-align:left;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.chip .st{font-size:11px;color:var(--ink-3)}
.opts{display:grid;grid-template-columns:110px 1fr;gap:14px 14px;align-items:center}
.opts>label{color:var(--ink-2);font-size:13px}
.opts>.seg{justify-self:start}
.summary{padding:20px;position:sticky;top:24px;display:grid;gap:14px}
.summary h2{margin:0;font-size:15px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.summary dt{color:var(--ink-3)}
.summary dd{margin:0;text-align:right;font-weight:500}
.summary .total{border-top:1px solid var(--rule);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.summary .total b{font-size:28px;font-weight:650;letter-spacing:-.02em}
.warnlist{display:grid;gap:6px;font-size:12px}
.warnlist div{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:7px 10px;line-height:1.5}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.tbl th{color:var(--ink-3);font-weight:500;font-size:12.5px;white-space:nowrap;background:var(--sunken)}
.tbl thead th:first-child{border-top-left-radius:var(--r)}
.tbl thead th:last-child{border-top-right-radius:var(--r)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl td:first-child{white-space:nowrap}
.tbl tr.click:hover td{background:var(--sunken)}
.tbl td.num,.tbl th.num{text-align:right}
.scroll-x{overflow-x:auto}

/* job detail */
.jobhead{padding:20px 22px;display:grid;gap:12px;margin-bottom:18px}
.jobhead h1{font-size:21px;margin:0;font-weight:650;letter-spacing:-.01em}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.attn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink);border-radius:12px;padding:13px 16px;display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.attn b{color:var(--warn)}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lane{display:flex;flex-direction:column;overflow:hidden}
.lane header{display:flex;align-items:center;gap:8px;padding:11px 14px}
.lane header h3{margin:0;font-size:15px;flex:1}
.live{aspect-ratio:16/10;background:var(--sunken);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px}
.live img{width:100%;height:100%;object-fit:cover;object-position:top}
.lane .info{padding:10px 14px;display:grid;gap:6px;font-size:13px}
.lane .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);margin-top:18px}
.log summary{padding:10px 14px;cursor:pointer;color:var(--ink-2)}
.log pre{margin:0;padding:10px 14px;max-height:320px;overflow:auto;font-size:12px;line-height:1.6;border-top:1px solid var(--rule);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}

/* results grid */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{width:auto;min-width:120px}
.rgrid{display:grid;gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
.rgrid table{border-collapse:collapse;width:100%;min-width:640px}
.rgrid th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);font-weight:500;color:var(--ink-2);white-space:nowrap}
.rgrid td{border-bottom:1px solid var(--rule);padding:10px 12px;vertical-align:top}
.rgrid td.q{width:30%;min-width:220px}
.rgrid .qid{color:var(--ink-3);font-size:12px}
.cell{display:block;width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:11px;padding:0;text-align:left;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.cell:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell .th{height:140px;background:var(--sunken);overflow:hidden}
.cell .th img{width:100%;display:block}
.cell .tx{padding:8px 10px;font-size:12px;color:var(--ink-2);height:120px;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.cell .cm{display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3)}
.cell .cm .sp{flex:1}
.score-pill{font-weight:700;color:var(--ink)}

/* viewer */
dialog{border:1px solid var(--rule);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;box-shadow:var(--shadow-2)}
dialog::backdrop{background:rgba(18,18,24,.42);backdrop-filter:blur(2px)}
.dlg{padding:24px 26px;display:grid;gap:14px;width:min(560px,92vw)}
.dlg h3{margin:0;font-size:17px;font-weight:650}
.dlg p{margin:0;color:var(--ink-2)}
.dlg .row.end{justify-content:flex-end}
.dlg pre{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;background:var(--sunken);border-radius:8px;padding:10px 12px}
.dlg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--sunken);border-radius:4px;padding:0 4px;word-break:break-all}
.dlg .tbl td{vertical-align:top}
.confirm dl{display:grid;grid-template-columns:1fr auto;gap:8px 18px;margin:0}
.confirm dd{margin:0;text-align:right;font-weight:600}
#viewer{width:min(1400px,96vw);height:92vh;max-height:92vh}
#viewer[open]{display:flex;flex-direction:column}
.vhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.vhead .t{flex:1;min-width:200px}
.vhead .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);min-height:0}
.vshot{overflow:auto;background:var(--sunken);border-right:1px solid var(--rule)}
.vshot img{display:block;width:100%;cursor:zoom-in}
.vshot img.full{width:auto;max-width:none;cursor:zoom-out}
.vside{overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.vside h4{margin:0 0 6px;font-size:13px;color:var(--ink-3);font-weight:500}
.vside pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.7;background:var(--sunken);border-radius:8px;padding:10px 12px;max-height:46vh;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}

/* compare & score */
.cmp{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.qlist{list-style:none;margin:0;padding:6px;max-height:calc(100vh - 230px);overflow:auto;position:sticky;top:12px}
.qlist button{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:6px}
.qlist button:hover{background:var(--sunken)}
.qlist button[aria-current="true"]{background:var(--accent-soft)}
.qlist .i{color:var(--ink-3);font-size:12px;grid-row:span 2}
.qlist .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qlist .s{font-size:11px;color:var(--ink-3);display:flex;gap:5px;align-items:center}
.qtext{font-size:19px;font-weight:700;line-height:1.45;margin:4px 0 10px;white-space:pre-wrap}
.aisum{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:7px;padding:10px 14px;margin:10px 0 14px}
.aisum h4{margin:0 0 3px;font-size:12px;color:var(--accent)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{display:flex;flex-direction:column;min-width:0}
.col.best{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark)}
.colhead{display:flex;align-items:center;gap:8px;padding:11px 13px 3px}
.colhead h3{margin:0;font-size:15px;flex:1}
.colhead h3 span{position:relative;z-index:0}
.col.best .colhead h3 span::after{content:"";position:absolute;left:-3px;right:-3px;bottom:1px;height:.55em;background:var(--mark);z-index:-1;border-radius:2px;animation:swipe .35s ease-out both}
@keyframes swipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.col.best .colhead h3 span::after{animation:none}}
.bestbtn{border:1px solid var(--rule);background:transparent;border-radius:5px;padding:2px 9px;font-size:12px;color:var(--ink-2)}
.col.best .bestbtn{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:700}
.cmeta{display:flex;gap:10px;padding:0 13px 9px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.cview{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--sunken);height:min(52vh,560px);overflow:auto}
.cview img{display:block;width:100%;cursor:zoom-in}
.cview pre{margin:0;padding:11px 13px;white-space:pre-wrap;word-break:break-word;font-family:inherit;background:var(--surface);min-height:100%;line-height:1.7}
.scores{padding:9px 13px 3px;display:grid;gap:5px}
.dim{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.pills{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pills button{border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:2px 0;font-size:13px}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pills.ai button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.avg{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);padding:2px 0 3px}
.avg b{font-size:15px;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:3px 13px 8px}
.tags button{border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:0 9px;font-size:12px;color:var(--ink-3)}
.tags button[aria-pressed="true"]{border-style:solid;border-color:var(--ink-2);color:var(--ink);background:var(--sunken)}
.note{margin:0 13px 12px;width:auto!important;min-height:54px;font-size:13px}
.aic{margin:0 13px 10px;font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:6px;padding:6px 9px}

/* analysis */
.ana{display:grid;gap:26px;max-width:1150px;grid-template-columns:minmax(0,1fr)}
.ana>section{min-width:0}
.ana h2{font-size:17px;margin:0 0 10px;font-weight:650}
.ana .lead{color:var(--ink-3);margin:-6px 0 12px;font-size:13px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:2em 9em 1fr 4em;align-items:center;gap:12px;padding:10px 14px}
.rank .n{font-weight:700;color:var(--ink-3);font-size:17px}
.rank .nm{font-weight:700;display:flex;gap:8px;align-items:center}
.rank .track{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--c)}
.rank .v{text-align:right;font-weight:700;font-size:16px}
td.heat{background:color-mix(in srgb,var(--accent) calc(var(--h) * 1%),var(--surface))}
td.hi{font-weight:700}
.report{padding:16px 20px;white-space:pre-wrap;line-height:1.8;max-width:56em}
.astat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
.picks{display:grid;gap:6px}
.picks button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:9px 12px;align-items:center}
.picks button:hover{border-color:var(--accent)}

/* library / sites / settings */
.libgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.liblist{padding:6px;display:grid;gap:2px}
.liblist button{text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:7px;display:flex;justify-content:space-between;gap:8px}
.liblist button:hover{background:var(--sunken)}
.liblist button[aria-current="true"]{background:var(--accent-soft)}
.sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.site{padding:18px 18px 16px;display:grid;gap:10px;align-content:start}
.site h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px;font-weight:650}
.site .url{font-size:12px;color:var(--ink-3);word-break:break-all}
.site.off{opacity:.55}
.site .st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.site .acts{display:flex;gap:6px;align-items:center;margin-top:2px}
.site .tagline{display:flex;gap:6px;flex-wrap:wrap}
.tagx{font-size:11.5px;border-radius:6px;padding:0 7px;line-height:20px;background:var(--sunken);color:var(--ink-2)}
.set{display:grid;gap:18px;max-width:820px}
.set section{padding:22px 24px;display:grid;gap:14px}
.set h2{font-size:16px;margin:0}
.grid2{display:grid;grid-template-columns:140px 1fr;gap:12px 14px;align-items:center}
.grid2>label{color:var(--ink-2);font-size:13px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.formgrid{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;align-items:center}
.formgrid>label{font-size:13px;color:var(--ink-2)}
details.more summary{cursor:pointer;color:var(--accent);margin:4px 0}

@media (max-width:980px){
  .newgrid,.libgrid,.cmp{grid-template-columns:1fr}
  .summary{position:static}
  .qlist{position:static;max-height:220px}
  .vbody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .vshot{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;padding-top:max(8px,env(safe-area-inset-top))}
  .brand,.engine,.nav .grow{display:none}
  .nav{border-right:0;border-bottom:1px solid var(--rule)}
  .nav a svg{display:none}
  .nav a{white-space:nowrap}
  .main{padding:18px 14px 56px}
  .opts,.grid2,.formgrid{grid-template-columns:1fr}
  .cols{grid-auto-columns:minmax(86vw,1fr)}
  .rank li{grid-template-columns:1.5em 5.5em 1fr 3em}
}
</style>
</head>
<body>
<nav class="nav" aria-label="主导航">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="var(--accent)"/>
    <rect x="7" y="8" width="9" height="7" rx="2.2" fill="#fff" opacity=".55"/><rect x="13" y="13" width="10" height="9" rx="2.5" fill="#fff"/></svg>
    <div><b>竞品采集台</b><span>AI 对话产品评测</span></div></div>
  <a href="#/new" data-nav="new"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7.2"/><path d="M10 6.6v6.8M6.6 10h6.8"/></svg>新建采集</a>
  <a href="#/jobs" data-nav="jobs"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="3.2" width="13.6" height="13.6" rx="3"/><path d="M6.5 10.2l2.3 2.3 4.7-4.9"/></svg>任务 <span class="count" id="attnCount" hidden></span></a>
  <a href="#/library" data-nav="library"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h8.5a3 3 0 0 1 3 3v8H7a3 3 0 0 1-3-3z"/><path d="M7.5 8h5M7.5 11h3.5"/></svg>题库</a>
  <a href="#/sites" data-nav="sites"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5.8" height="5.8" rx="1.6"/><rect x="11.2" y="3" width="5.8" height="5.8" rx="1.6"/><rect x="3" y="11.2" width="5.8" height="5.8" rx="1.6"/><rect x="11.2" y="11.2" width="5.8" height="5.8" rx="1.6"/></svg>产品</a>
  <a href="#/settings" data-nav="settings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h7M15 6h1M4 14h1M9 14h7"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg>设置</a>
  <div class="grow"></div>
  <div class="engine" id="engineBox"></div>
</nav>
<main class="main" id="main"></main>

<dialog id="dlg"></dialog>
<dialog id="viewer"></dialog>
<input type="file" id="fileIn" accept=".xlsx,.xlsm,.csv,.txt,.json" hidden>
<div class="toast" id="toast" role="status"></div>
<div class="offline" id="offline" hidden>连不上竞品采集台：可能运行它的终端窗口被关掉了。重新双击“启动.command”后，这个页面会自动恢复。</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const COLORS = ["#3B5BDB","#E8590C","#2F9E44","#AE3EC9","#0C8599","#C2255C","#5C940D","#F08C00","#495057","#1971C2"];
const MODE = {standard:"标准", reasoning:"深度思考", search:"联网搜索", reasoning_search:"思考+搜索"};
const SHOT = {both:"长图+窗口", long:"仅长图", window:"仅窗口", off:"不截图"};
const JOB_ST = {queued:["排队中",""], running:["采集中","run"], paused:["已暂停","warn"], needs_attention:["需要处理","bad"],
  stopping:["正在停止","warn"], stopped:["已停止",""], done:["已完成","ok"], failed:["出错","bad"]};
const LANE_ST = {queued:["排队",""], starting:["启动中","run"], running:["采集中","run"], waiting:["间隔中","run"], resting:["休息中","warn"],
  paused:["已暂停","warn"], needs_human:["需要处理","bad"], done:["完成","ok"], stopped:["已停止",""], error:["出错","bad"], skipped:["已跳过",""]};
const SITE_ST = {ready:["可以采集","ok"], guest:["可能未登录","warn"], need_login:["未登录","bad"], blocked:["需要验证","bad"],
  error:["打不开","bad"], checking:["检查中…","run"]};
const R_ST = {ok:["成功","ok"], timeout:["超时","warn"], error:["失败","bad"]};
const INC_OK = new Set(["url","on","on?","guest"]);
const INC_TXT = {url:"是（无痕网址）", on:"是", "on?":"已点开（状态未确认）", guest:"未登录浏览器", not_found:"否：没找到入口", not_configured:"否：未配置", click_failed:"否：点击失败"};
const ACTIVE = new Set(["queued","running","paused","needs_attention","stopping"]);

let S = {sites:[], site_status:{}, settings:null, engine:{}, lan:null};
let pollTimer = null, pageGen = 0;
const draft = loadDraft();

async function api(method, url, body){
  const opt = {method, headers:{}};
  if (body !== undefined) {
    if (body instanceof Blob || body instanceof ArrayBuffer) opt.body = body;
    else { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  }
  let r;
  try { r = await fetch(url, opt); }
  catch (e) { $("#offline").hidden = false; throw new Error("连不上竞品采集台，请确认它还在运行"); }
  $("#offline").hidden = true;
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error(data?.error || `请求失败（${r.status}）`);
  return data;
}
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3400); }
const fmtS = ms => ms == null ? "—" : (ms / 1000).toFixed(1) + "s";
const f1 = v => v == null ? "—" : v.toFixed(1);
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
function badge(map, k){ const [t, c] = map[k] || [k || "未检查", ""]; return `<span class="badge ${c}">${esc(t)}</span>`; }
function siteName(k){ return S.sites.find(s => s.key === k)?.name || k; }
function colorOf(keys, k){ return COLORS[Math.max(0, keys.indexOf(k)) % COLORS.length]; }
function fmtTime(iso){ if (!iso) return "—"; const d = new Date(iso); const p = n => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function dur(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h} 小时 ${m} 分` : `${Math.max(1, m)} 分钟`; }
function setPoll(fn, ms){ clearInterval(pollTimer); pollTimer = fn ? setInterval(fn, ms) : null; }
function fileURL(jid, rel, bust){ return rel ? `/files/${jid}/${rel.split("/").map(encodeURIComponent).join("/")}${bust ? "?t=" + Date.now() : ""}` : null; }

async function refreshState(){
  try { S = await api("GET", "/api/state"); } catch { return; }
  renderEngine(); applyRemote();
}
function applyRemote(){
  const remote = S.local === false;
  $$('.nav a[data-nav="new"],.nav a[data-nav="library"],.nav a[data-nav="sites"],.nav a[data-nav="settings"]').forEach(a => a.hidden = remote);
  return remote;
}
function renderEngine(){
  const e = S.engine || {};
  const busy = !!e.active;
  $("#engineBox").innerHTML = `<div><span class="pulse ${busy ? "" : "idle"}"></span>${busy ? "<b>正在采集</b>" : "引擎空闲"}</div>`
    + (e.queued?.length ? `<div>排队 ${e.queued.length} 个任务</div>` : "")
    + (e.login_open?.length ? `<div>登录窗口：${e.login_open.map(siteName).map(esc).join("、")}</div>` : "")
    + (S.lan ? `<div style="margin-top:6px">手机访问<br><b>${esc(S.lan)}</b></div>` : "");
}
async function refreshAttn(){
  try {
    const jobs = await api("GET", "/api/jobs");
    const n = jobs.filter(j => j.status === "needs_attention").length;
    const c = $("#attnCount"); c.hidden = !n; c.textContent = n;
    return jobs;
  } catch { return null; }
}

/* ===================================================== router */
function route(){
  const h = location.hash.replace(/^#\/?/, "") || (S.local === false ? "jobs" : "new");
  const [page, a, b] = h.split("/");
  pageGen++;
  setPoll(null);
  $$(".nav a").forEach(x => x.setAttribute("aria-current", x.dataset.nav === (page === "job" ? "jobs" : page) ? "page" : "false"));
  const fn = {new:pageNew, jobs:pageJobs, job:() => pageJob(a, b || "progress"), library:pageLibrary, sites:pageSites, settings:pageSettings}[page] || pageNew;
  fn();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ===================================================== new job */
function loadDraft(){
  let d = null; try { d = JSON.parse(localStorage.getItem("cb:draft")); } catch {}
  return Object.assign({text:"", sites:[], name:"", mode:"standard", device:"desktop", shot:"both", repeat:1,
    auto_analyze:false, pacing:null, input:"manual", incognito:null, profile:"account", purpose:"", dimsText:null, tagsText:null, siteOpts:{}}, d || {});
}
function saveDraft(){ try { localStorage.setItem("cb:draft", JSON.stringify(draft)); } catch {} }
let previewInfo = {count:0, dup:0, multi:0, cats:[]};

function pageNew(){
  const st = S.settings;
  if (!draft.pacing && st) draft.pacing = {...st.pacing};
  if (draft.incognito == null) draft.incognito = st ? st.incognito_default !== false : true;
  if (draft.dimsText == null && st) draft.dimsText = st.dims.join("\n");
  if (draft.tagsText == null && st) draft.tagsText = st.tags.join("，");
  const pc = draft.pacing || {delay_min:3, delay_max:8, batch_size:40, batch_rest_min:15};
  const llmOK = st?.llm?.has_key && st?.llm?.model;
  $("#main").innerHTML = `
  <div class="ph"><div><h1>新建采集</h1><p>把问题发给选中的产品，自动等回答结束、截图、记录文本和耗时。</p></div></div>
  <div class="newgrid">
    <div class="form">
      <section class="card field">
        <div class="fhead"><h2>问题</h2>
          <div class="seg" id="inSeg">${[["manual","手动输入"],["file","导入文件"],["lib","从题库选"]].map(([k, t]) => `<button data-in="${k}" aria-pressed="${draft.input === k}">${t}</button>`).join("")}</div>
        </div>
        <div id="paneFile" ${draft.input === "file" ? "" : "hidden"} style="margin-bottom:12px">
          <div class="drop" id="drop">把 Excel、CSV 或 TXT 拖到这里，或点击选择文件
            <div class="hint">表格第一行写表头：“问题”必填，“分类”可选，“追问1”“追问2”…可选。导入后会追加到下面的文本框，可以再改。</div></div>
        </div>
        <div id="paneLib" ${draft.input === "lib" ? "" : "hidden"} style="margin-bottom:12px"><div class="libpick" id="libPick"><div class="muted small">加载中…</div></div></div>
        <textarea id="qText" spellcheck="false" placeholder="每行一个问题，例如：&#10;帮我写一封请假邮件&#10;[写作] 行首用方括号标分类&#10;[多轮] 推荐三本经济学入门书 || 第二本讲了什么？（用 || 分隔追问）">${esc(draft.text)}</textarea>
        <div class="hint" id="qInfo"></div>
      </section>
      <section class="card field">
        <div class="fhead"><h2>产品</h2><div class="row small"><a href="#" id="selAll">全选可用的</a><a href="#" id="selNone">清空</a><a href="#/sites">管理产品与登录</a></div></div>
        <div class="chips" id="siteChips"></div>
      </section>
      <section class="card field" id="optSec" ${draft.sites.length ? "" : "hidden"}>
        <div class="fhead"><h2>模型与模式</h2><span class="small muted">每个产品单独选，不选就用页面当前的默认。产品出了新模型或新菜单，点产品名下的“更新选项 / 录制”</span></div>
        <div id="optRows"></div>
      </section>
      <section class="card field">
        <div class="fhead"><h2>分析目的</h2><span class="small muted">每个任务可以不一样，AI 打分和写结论都围绕它。选填，之后在“分析”页也能改</span></div>
        ${anaEditor("n", draft.purpose, draft.dimsText, draft.tagsText, llmOK)}
      </section>
      <section class="card field">
        <div class="fhead"><h2>采集选项</h2></div>
        <div class="opts">
          <label for="jName">任务名</label><input type="text" id="jName" placeholder="不填会自动生成" value="${esc(draft.name)}">
          <label>无痕对话</label><div><div class="seg" data-opt="incognito"><button data-v="1" aria-pressed="${!!draft.incognito}">开启</button><button data-v="0" aria-pressed="${!draft.incognito}">关闭</button></div>
            <div class="hint">使用产品自带的临时/无痕对话：不进历史记录，不受账号记忆和个性化影响，对比更公平。ChatGPT、Claude 直接用无痕网址打开，其他产品会尝试点“临时对话/无痕”按钮；找不到入口的按普通对话采集，并在结果里标注。</div></div>
          <label>账号</label><div><div class="seg" data-opt="profile"><button data-v="account" aria-pressed="${draft.profile !== "guest"}">用登录的账号</button><button data-v="guest" aria-pressed="${draft.profile === "guest"}">不登录（全新浏览器）</button></div>
            <div class="hint">“不登录”相当于浏览器的无痕窗口：不带任何登录状态、记录和缓存，适合看新用户/未登录用户的体验。很多产品不登录不能提问，这时会提示你处理。</div></div>
          <label>设备</label><div><div class="seg" data-opt="device"><button data-v="desktop" aria-pressed="${draft.device === "desktop"}">电脑网页</button><button data-v="mobile" aria-pressed="${draft.device === "mobile"}">手机网页（H5）</button></div>
            <div class="hint">手机网页会模拟 iPhone 打开，适合看移动端体验；部分产品的手机网页会引导下载 App。</div></div>
          <label>截图</label><div class="seg" data-opt="shot">${Object.entries(SHOT).map(([k, t]) => `<button data-v="${k}" aria-pressed="${draft.shot === k}">${t}</button>`).join("")}</div>
          <label>每题跑几次</label><div><div class="seg" data-opt="repeat">${[1,3,5,10].map(n => `<button data-v="${n}" aria-pressed="${+draft.repeat === n}">${n} 次</button>`).join("")}</div>
            <div class="hint">多次运行可以看同一问题的回答稳定性。</div></div>

async function updatePreview(){

function estimate(){
  const n = previewInfo.count * (+draft.repeat || 1);
  const pc = draft.pacing || {delay_min:3, delay_max:8, batch_size:40, batch_rest_min:15};
  const per = 40 + ((+pc.delay_min || 0) + (+pc.delay_max || 0)) / 2;
  const rests = pc.batch_size ? Math.floor(Math.max(0, n - 1) / pc.batch_size) : 0;
  return {n, total: n * draft.sites.length, secs: n * per + rests * (pc.batch_rest_min || 0) * 60};
}
function warnings(){
  const w = [];
  const bad = draft.sites.filter(k => ["need_login","blocked","error"].includes(S.site_status[k]?.state));
  const unk = draft.sites.filter(k => !S.site_status[k]);
  if (bad.length) w.push(`${bad.map(siteName).join("、")} 上次检查不可用，开始前建议先到“产品”页登录。`);
  if (unk.length) w.push(`${unk.map(siteName).join("、")} 还没检查过登录状态。没登录的话，采集时会暂停并提醒你登录。`);
  const e = estimate();
  if (e.n > 150) w.push(`每个产品要问 ${e.n} 条，量比较大。建议加大间隔、开启分批休息，并使用测试账号。`);
  if (draft.device === "mobile") w.push("手机网页模式下，个别产品可能只显示下载 App 的页面。");
  if (draft.incognito && draft.profile !== "guest") { const noUrl = draft.sites.filter(k => !S.sites.find(s => s.key === k)?.incognito_url);
    if (noUrl.length) w.push(`${noUrl.map(siteName).join("、")} 没有配置无痕网址，会尝试点页面上的无痕按钮；找不到就按普通对话采集。`); }
  const perShot = {both:1.0, long:0.8, window:0.25, off:0}[draft.shot] ?? 1;
  const needGb = e.total * perShot / 1000;
  if (S.disk_free_gb != null && S.disk_free_gb < needGb + 3)
    w.push(`磁盘只剩 ${S.disk_free_gb} GB，这次截图预计要 ${Math.max(0.1, needGb).toFixed(1)} GB 左右。空间不足会导致截图失败，可以先删除不需要的旧任务，或把截图格式改成 JPG、清晰度调低。`);
  if (S.settings?.browser?.headless) w.push("当前是无界面模式：遇到登录或验证时无法人工处理，会直接记为失败。");
  return w;
}

/* ---------- 结论框里的 Markdown（标题、列表、加粗、行内代码） */
function mdLite(t){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of String(t).split("\n")) {
    const s = raw.trim(); let m;
    if (!s) { close(); continue; }
    if ((m = s.match(/^#{1,6}\s+(.*)/))) { close(); out += `<h4>${inl(m[1])}</h4>`; }
    else if ((m = s.match(/^([-*•]|\d+[.、)])\s+(.*)/))) { const tag = /\d/.test(m[1][0]) ? "ol" : "ul"; if (list !== tag) { close(); out += `<${tag}>`; list = tag; } out += `<li>${inl(m[2])}</li>`; }
    else { close(); out += `<p>${inl(s)}</p>`; }
  }
  close(); return out;
}

/* ---------- results tab */
const RF = {site:"all", cat:"all", st:"all", q:"", page:0};

function filteredRows(){
  const idx = resultIndex();

    if (RF.cat !== "all" && q.category !== RF.cat) return false;
    if (RF.q && !(q.query + (q.turns || []).join(" ")).toLowerCase().includes(RF.q.toLowerCase())) return false;
    if (RF.st !== "all") {
      const rs = J.results.sites.filter(s => RF.site === "all" || s.key === RF.site).map(s => idx.get(q.id + "|" + s.key));
      if (RF.st === "pending" ? !rs.some(r => !r) : !rs.some(r => r && r.status === RF.st)) return false;
    }
    return true;
  });
}

    if (!keys.includes(RF.site)) RF.site = "all"; if (!cats.includes(RF.cat)) RF.cat = "all";

function drawResultTable(){

function modeTxt(v){ return {on:"已开启", off:"已关闭", "on?":"已点开（状态未确认）", "off?":"未开启（状态未确认）", not_found:"没找到开关", not_configured:"未配置", click_failed:"点击失败"}[v] || v; }

    if (t.dataset.act === "score") { const d = t.parentElement.dataset.dim, n = +t.dataset.n; it.src = "human";

    if (t.dataset.act === "tag") { const tg = t.dataset.tag; it.tags = (it.tags || []).includes(tg) ? it.tags.filter(x => x !== tg) : [...(it.tags || []), tg];

    const it = a.items[k] || {scores:{}, tags:[], note:"", src:"human"}; it.note = e.target.value; a.items[k] = it;

function stats(){
  const res = J.results, a = J.analysis, dims = a.dims, idx = resultIndex();
  const cats = [...new Set(res.queries.map(q => q.category))];
  const mean = v => v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
  return {cats, rows: res.sites.map(s => {
    const dim = Object.fromEntries(dims.map(d => [d, []])), cat = Object.fromEntries(cats.map(c => [c, []])), tags = {};
    let all = [], wins = 0, ttft = [], total = [], chars = [], ok = 0, n = 0;
    for (const q of res.queries) {
      const r = idx.get(q.id + "|" + s.key);
      if (r) { n++; if (r.status === "ok") { ok++; chars.push((r.response_text || "").length); } if (r.ttft_ms != null) ttft.push(r.ttft_ms); if (r.total_ms != null) total.push(r.total_ms);
 }
      const it = a.items[q.id + "|" + s.key];
      if (it) { dims.forEach(d => { if (typeof it.scores?.[d] === "number") dim[d].push(it.scores[d]); });
        const av = itemAvg(it, dims); if (av != null) { all.push(av); cat[q.category].push(av); } (it.tags || []).forEach(t => tags[t] = (tags[t] || 0) + 1); }
      if (a.best[q.id] === s.key) wins++;
    }
    return {key:s.key, name:s.name, overall:mean(all), scored:all.length, n, ok, wins, tags, ttft:mean(ttft), total:mean(total), chars:mean(chars),
      okRate:n ? ok / n : null, dim:Object.fromEntries(dims.map(d => [d, mean(dim[d])])), cat:Object.fromEntries(cats.map(c => [c, mean(cat[c])]))};
  })};
}
function heat(v, top){ return `<td class="num heat ${top ? "hi" : ""}" style="--h:${v == null ? 0 : Math.round((v - 1) / 4 * 38)}">${f1(v)}</td>`; }

function probeView(key, r){

  if (r.state === "running") return `<div class="attn" style="margin:0"><span>正在试跑：${esc(r.question)}（开始于 ${fmtTime(r.started_at)}）。不要操作弹出的浏览器窗口。</span></div>`;

  const rows = [];
  if (dg.input !== undefined) rows.push(["输入框", dg.input ? ok(true, "找到") : ok(false, "没找到"), dg.input ? `<code>${esc(dg.input)}</code>` : "可能未登录"]);

  if (dg.send) rows.push(["发送", ok(true, "已发送"), esc(dg.send)]);
  if (dg.sidebar) rows.push(["侧边栏", dg.sidebar === "failed" ? ok(false, "处理失败") : dg.sidebar === "blurred" ? ok(null, "已模糊") : ok(true, dg.sidebar === "collapsed" ? "已收起" : "未显示"),
    dg.sidebar === "blurred" ? "没找到收起按钮或点了没收起，已把侧边栏模糊处理。可以在设置里填“收起侧边栏按钮”选择器" : ""]);
  if (dg.method) {

    const after = dg.response_after || {}, before = dg.response_before || {};
    rows.push(["回答正文", dg.method === "selector" ? ok(true, "选择器取到") : hasSel ? ok(false, "选择器失效") : ok(null, "通用识别"),
      dg.method === "selector" ? `<code>${esc(after.sel)}</code>　发送前 ${before.count ?? 0} 条 → 回答后 ${after.count ?? 0} 条`
        : hasSel ? `候选 ${sel.response.map(x => `<code>${esc(x)}</code>`).join(" ")} 都没取到这条回答，已退回通用识别。页面可能改版了，到“设置”里改回答正文选择器`
        : "没有配置回答选择器，按页面文字自动识别，回答前后可能混入界面文字，也没有 Markdown 格式"]);
  }
  if (rec) rows.push(["结束判定", dg.stop_seen ? ok(true, "看到停止按钮") : ok(null, "没看到停止按钮"),
    dg.stop_seen ? "生成中能识别到停止按钮，结束判定更准" : "按页面文字停止变化判断结束；回答中途停顿较久时可能提前截图，可在设置里调大稳定秒数"]);
  if (dg.scroll) rows.push(["长截图滚动区域", dg.scroll.startsWith("selector:") ? ok(true, "选择器") : dg.scroll === "none" ? ok(false, "没找到") : ok(null, dg.scroll === "page" ? "整页滚动" : "自动识别"),
    (dg.scroll.startsWith("selector:") ? `<code>${esc(dg.scroll.slice(9))}</code>` : "") + (dg.long_shot_error ? `　长截图失败：${esc(dg.long_shot_error)}` : "")]);
  if (rec) rows.push(["计时", "", `首次输出 ${fmtS(rec.ttft_ms)}　正文开始 ${fmtS(rec.answer_start_ms)}　完成 ${fmtS(rec.total_ms)}　${(rec.response_text || "").length} 字`]);
  const shot = rec && (rec.screenshot || rec.window_screenshot);

    ${rows.length ? `<table class="tbl"><tbody>${rows.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td class="small">${c}</td></tr>`).join("")}</tbody></table>` : ""}
    ${rec ? `<div><h4 style="margin:6px 0">取到的回答${rec.response_md ? "（Markdown）" : ""}</h4><pre style="max-height:320px;overflow:auto;white-space:pre-wrap">${esc(rec.response_md || rec.response_text || "（空）")}</pre></div>` : ""}

    <div class="row">${shot ? `<a class="btn" href="${pf(shot)}" target="_blank">看长截图</a>` : ""}${rec?.window_screenshot ? `<a class="btn" href="${pf(rec.window_screenshot)}" target="_blank">看窗口截图</a>` : ""}${r.error_shot ? `<a class="btn" href="${pf(r.error_shot)}" target="_blank">看出错时的页面</a>` : ""}
      <span class="spacer"></span><span class="small muted">${fmtTime(r.finished_at)}</span></div>`;

    model:$("#lModel").value.trim(), vision:$("#lVis").checked, concurrency:+$("#lConc").value || 2});
  $("#lTest").onclick = async () => { const st = $("#lTestSt"); st.className = "small muted"; st.textContent = "测试中…";
    try { const r = await api("POST", "/api/settings/test-llm", {llm:llm()}); st.className = "small"; st.style.color = "var(--good)"; st.textContent = `连接成功，用时 ${r.seconds} 秒`; }
    catch (e) { st.className = "small err"; st.textContent = e.message; } };
  $("#saveSet").onclick = async () => {
    const lines = id => $("#" + id).value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!lines("dims").length) { toast("至少保留一个评分维度"); return; }
    const body = {llm:llm(), dims:[...new Set(lines("dims"))], tags:[...new Set(lines("tags"))],
      pacing:{delay_min:+$("#pMin").value || 0, delay_max:+$("#pMax").value || 0, batch_size:+$("#pBs").value || 0, batch_rest_min:+$("#pBr").value || 0, retries:+$("#pRt").value || 0},
      wait:{stable:+$("#wSt").value || 5, max:+$("#wMax").value || 180}, shot:{dpr:+segVal("dpr"), format:segVal("fmt")},
      browser:{channel:segVal("chan") || "", headless:$("#hl").checked}, notify:$("#nt").checked, incognito_default:$("#incDef").checked, hide_sidebar:$("#hideSb").checked};
    try { S.settings = await api("PUT", "/api/settings", body); draft.pacing = null; draft.incognito = null; saveDraft(); toast("设置已保存"); pageSettings(); } catch (e) { toast(e.message); }
  };
}

/* ===================================================== boot */
(async () => {
  await refreshState();
  refreshAttn();
  setInterval(() => { refreshState(); refreshAttn(); }, 5000);
  route();
})();
</script>
</body>
</html>
